<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やせるバディ</title>
<meta name="apple-mobile-web-app-title" content="やせるバディ">
<meta name="application-name" content="やせるバディ">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
:root{--bg:#f6faf7;--card:#fff;--tx:#1b2b22;--mu:#5d6f65;--ac:#1f9d62;--ln:#dfe9e3}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.logo{display:block;width:180px;height:180px;margin:8px auto 0;border-radius:40px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:20px;text-align:center;margin:12px 0 4px}
.lead{text-align:center;color:var(--mu);margin:0 0 8px}
.card{background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:16px;margin:14px 0}
ol{list-style:none;padding:0;margin:0}
li{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln);font-size:17px}
li:first-child{border-top:0}
.n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:18px}
.i{flex:0 0 30px;display:flex;justify-content:center;color:var(--tx)}.i:empty{display:none}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:14px;margin-top:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;text-decoration:none}
.sub{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.mu{color:var(--mu);font-size:14px}
.arrow{text-align:center;font-size:28px;color:var(--ac);margin:0}
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#splash img{width:200px;height:200px}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<iframe id="app" hidden title="やせるバディ" allow="clipboard-write"></iframe>
<div id="splash" hidden><img src="icon-192.png" alt="やせるバディ"><p class="mu">開いています…</p></div>
<main id="main" hidden>
  <img class="logo" src="icon-192.png" alt="やせるバディ のロゴ">
  <h1>ホーム画面に追加しましょう</h1>
  <p class="lead">このページをホーム画面に追加すると、<br>このロゴのアイコンから、ワンタッチで食事管理アプリが開けます。</p>
  <div class="card" id="steps"></div>
  <a class="btn sub" id="open">追加せずにアプリを開く</a>
  <p class="mu" style="text-align:center;margin-top:16px">うまくいかないときは、ジムに来たときにトレーナーに声をかけてください。一緒にやります！</p>
</main>
<main id="nolink" hidden>
  <img class="logo" src="icon-192.png" alt="やせるバディ のロゴ">
  <h1>やせるバディ</h1>
  <p class="lead">このページは、Every Buddyから届いた専用リンクから開いてください。</p>
</main>
<script>
(function(){
  var APP = 'https:\/\/script.google.com\/macros\/s\/AKfycbxjLxl6tyj0fFTrCKf3-d8ReBc0rVXJRxFEuKSR3YIDKj9j9WpFZKnoqp6VvL_buvZ-\/exec';
  var q = new URLSearchParams(location.search);
  // アプリはこのページの中に表示する（Googleの「このアプリケーションは…」の帯を出さないため）
  function show(src) {
    var f = document.getElementById('app'), sp = document.getElementById('splash');
    sp.hidden = false;
    // アプリの準備ができたら（アプリから合図が来たら）ロゴの画面を消す
    window.addEventListener('message', function (e) { if (e.data === 'eb-ready') sp.hidden = true; });
    setTimeout(function () { sp.hidden = true; }, 20000);
    f.src = src; f.hidden = false;
  }
  var join = (q.get('join') || '').replace(/[^0-9a-z]/gi, '');
  if (join) { show(APP + '?join=' + join); return; }
  var t = (q.get('t') || '').replace(/[^0-9a-f]/gi, '');
  if (!t) { document.getElementById('nolink').hidden = false; return; }
  var appUrl = APP + '?t=' + t;

  // ホーム画面のアイコンから開いたとき（URLに home=1 が付いている）は、すぐアプリへ
  if (q.get('home') === '1') { show(appUrl + '&home=1'); return; }
  if (q.get('open') === '1') { show(appUrl); return; }

  // このあとホーム画面に追加されると、今のURLがアイコンに保存される。
  // home=1 を付けておくことで、アイコンから開いたときはすぐアプリに進む。
  try { history.replaceState(null, '', location.pathname + '?t=' + t + '&home=1'); } catch (e) {}

  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var inApp = / Line\//i.test(ua) || /FBAN|FBAV|Instagram|KAKAOTALK|YJApp/i.test(ua);

  var ic = {
    share: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5" fill="none" stroke="#1f7ae0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2" fill="none" stroke="#1f7ae0" stroke-width="2" stroke-linecap="round"/></svg>',
    dots: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><circle cx="12" cy="5" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="19" r="2.2" fill="currentColor"/></svg>',
    add: '<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
  };
  function step(n, icon, txt) { return '<li><span class="n">' + n + '</span><span class="i">' + (icon || '') + '</span><span>' + txt + '</span></li>'; }
  var html;
  if (inApp) {
    html = '<p><b>今はLINEの中で開いています。</b>LINEの中ではホーム画面に追加できないので、いつものブラウザで開き直します。</p><ol>' +
      step(1, '', '下の緑のボタンを押してください。') +
      step(2, ios ? ic.share : ic.dots, ios ? '開かないときは、画面の下にある <b>共有マーク</b> を押して「<b>Safariで開く</b>」を選んでください。' : '開かないときは、画面の右上にある <b>︙</b> を押して「<b>ブラウザで開く</b>」を選んでください。') +
      '</ol><a class="btn" href="?t=' + t + '&openExternalBrowser=1">ブラウザで開き直す</a>';
  } else {
    var iosHtml = '<p style="margin:0 0 4px"><b>iPhoneは「Safari」で開いてください。</b></p><ol>' +
      step(1, ic.share, '画面の下（または上）にある <b>共有マーク</b> を押します。見つからないときは <b>…</b> を押すと出てきます。') +
      step(2, ic.add, '出てきた一覧を下へずらして「<b>ホーム画面に追加</b>」を押します。') +
      step(3, '', '右上の「<b>追加</b>」を押したら完了です。ホーム画面にこのロゴが出ます！') + '</ol>';
    var andHtml = '<p style="margin:0 0 4px"><b>Androidは「Chrome」で開いてください。</b></p><ol>' +
      step(1, ic.dots, '画面の右上にある <b>︙</b>（点が3つ）を押します。') +
      step(2, ic.add, '「<b>ホーム画面に追加</b>」を押します。') +
      step(3, '', '「<b>追加</b>」（または「インストール」）を押したら完了です。ホーム画面にこのロゴが出ます！') + '</ol>' +
      '<p class="mu" style="margin:6px 0 0">Galaxyの「インターネット」アプリのときは、右下の <b>≡</b> →「<b>ページを追加</b>」→「<b>ホーム画面</b>」の順に押してください。</p>';
    var tb = function (id, label, on) { return '<button type="button" data-os="' + id + '" style="flex:1;padding:10px;border-radius:10px;font:inherit;font-weight:700;border:2px solid #1f9d62;' + (on ? 'background:#1f9d62;color:#fff' : 'background:#fff;color:#1f9d62') + '">' + label + '</button>'; };
    var first = android ? 'and' : 'ios';
    html = '<div id="ostabs" style="display:flex;gap:8px;margin-bottom:10px">' + tb('ios', '📱 iPhoneの方', first === 'ios') + tb('and', '🤖 Androidの方', first === 'and') + '</div><div id="osbody">' + (first === 'ios' ? iosHtml : andHtml) + '</div>';
    document.getElementById('steps').innerHTML = html;
    document.getElementById('ostabs').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      document.getElementById('osbody').innerHTML = b.dataset.os === 'ios' ? iosHtml : andHtml;
      [].forEach.call(document.querySelectorAll('#ostabs button'), function (x) { var on = x === b; x.style.background = on ? '#1f9d62' : '#fff'; x.style.color = on ? '#fff' : '#1f9d62'; });
    };
  }
  if (inApp) document.getElementById('steps').innerHTML = html;
  document.getElementById('open').href = '?t=' + t + '&open=1';
  document.getElementById('main').hidden = false;
})();
</script>
</body>
</html>
